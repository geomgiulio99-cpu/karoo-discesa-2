name: Genera keystore di debug

# Serve una volta sola. Le build di GitHub, non trovando un keystore, ne
# generano uno nuovo a ogni esecuzione: la firma dell'APK cambia ogni volta e
# il Karoo rifiuta l'aggiornamento, costringendo a disinstallare e a perdere
# tutti i segmenti sincronizzati. Questo workflow produce un keystore stabile
# da mettere sotto controllo di versione.

on:
  workflow_dispatch:

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - name: Crea il keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore debug.keystore -storepass android | head -20

      - name: Pubblica il keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error
